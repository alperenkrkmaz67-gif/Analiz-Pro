<body>

                <a href="/" class="logo">Analiz Pro</a>

    <div class="auth-container">
        <div class="glass-card">
            <h2 class="auth-title">Kayıt Ol</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" class="form-control" placeholder="ornek@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefon Numarası</label>
                    <input type="tel" id="phone" class="form-control" placeholder="05xxxxxxxxx" required>
                    <small style="color: var(--secondary-color); font-size: 0.8rem;">Başında 0 ile birlikte
                        giriniz.</small>
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Şifre Tekrar</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                <div class="form-group" style="display: flex; align-items: start; gap: 0.5rem; margin-top: 1rem;">
                    <input type="checkbox" id="terms-checkbox" required style="margin-top: 0.2rem; width: auto;">
                    <label for="terms-checkbox"
                        style="font-size: 0.9rem; color: var(--secondary-color); cursor: pointer;">
                        <a href="legal.html" target="_blank"
                            style="color: var(--primary-color); text-decoration: underline;">Kullanım koşullarını</a>
                        okudum, anladım ve kabul ediyorum.
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Kayıt Ol</button>
            </form>
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="login.html">Giriş Yap</a></p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="badge-18">
                <span>🔞</span>
                <span>Bu site 18 yaş ve üzeri içindir.</span>
            </div>

                    Politikası</a> | <a href="legal.html#disclaimer"

        </div>
    </footer>

        const firebaseConfig = {
            apiKey: "AIzaSyCQ4ACkLfcLIgljpJvwWpy2hF7RaalR7ZI",
            authDomain: "orananaliz.firebaseapp.com",
            projectId: "orananaliz",
            storageBucket: "orananaliz.firebasestorage.app",
            messagingSenderId: "1036870580660",
            appId: "1:1036870580660:web:4c74e00ec6f0483fe39ae1",
            measurementId: "G-D4BMSDR1JS"
        };

        // Firebase'i başlat
        firebase.initializeApp(firebaseConfig);

        // Global değişkenler (auth.js bunlara erişecek)
        const db = firebase.firestore();
        const auth = firebase.auth();

    <script src="auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => { // ASYNC EKLENDİ
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const termsCheckbox = document.getElementById('terms-checkbox');

            if (!termsCheckbox.checked) {
                alert('Lütfen kullanım koşullarını kabul ediniz.');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;

            if (password !== confirmPassword) {
                alert('Şifreler eşleşmiyor!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Kayıt olunuyor...';

            // ASYNC OLARAK ÇAĞRILDI
            const result = await Auth.register(username, email, password, phone);

            if (result.success) {
                alert(result.message);
                window.location.href = 'login.html';
            } else {
                alert(result.message);
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>
